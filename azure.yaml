name: azure-swa-nextjs-postgres
metadata:
  template: create-azure-app
requiredVersions:
  azd: ">= 1.26.0"
services:
  web:
    project: src/web
    dist: out
    host: staticwebapp
    config:
      apiDir: src/api
hooks:
  preprovision:
    windows:
      shell: pwsh
      run: node scripts/prepare-provision.mjs
    posix:
      shell: sh
      run: node scripts/prepare-provision.mjs

  prepackage:
    windows:
      shell: pwsh
      run: |
        npm ci
        npm run db:generate

        cd src/web && npm ci && npm run build
        cd ../api && npm ci && npm run build
        cd ../..
        node scripts/sync-prisma-client.mjs
        node scripts/slim-swa-api-package.mjs
        Get-ChildItem "src/api/node_modules/.prisma/client" -Filter *.node | Where-Object { $_.Name -notlike '*debian*' } | Remove-Item -Force -ErrorAction SilentlyContinue

    posix:
      shell: sh
      run: |
        npm ci
        npm run db:generate

        cd src/web && npm ci && npm run build
        cd ../api && npm ci && npm run build
        cd ../..
        node scripts/sync-prisma-client.mjs
        node scripts/slim-swa-api-package.mjs
        find src/api/node_modules/.prisma/client -name "*.node" ! -name "*debian*" -delete 2>/dev/null || true

  postprovision:
    windows:
      shell: pwsh
      run: scripts/migrate.ps1
    posix:
      shell: sh
      run: scripts/migrate.sh
